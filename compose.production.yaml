services:
  phppgadmin-web:
    image: ghcr.io/mapiiik/phppgadmin-frankenphp:latest
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
    volumes:
      - ${DATA_DIR:-./data}/config.inc.php:/app/public/conf/config.inc.php:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

volumes:
  caddy_data:
  caddy_config:
